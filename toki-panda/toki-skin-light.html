[data-mat] .tb-body{fill:var(--mat-body)}
[data-mat] .tb-shine{fill:var(--mat-shine)}
[data-mat] .tb-shade{fill:var(--mat-shade)}
[data-mat] .tb-edge{stroke:var(--mat-edge)}
.tb[data-hue="red"]{--tb-ink:var(--anatomy-red)}
.tb[data-hue="green"]{--tb-ink:var(--anatomy-green)}
.tb[data-hue="blue"]{--tb-ink:var(--anatomy-blue)}
.tb[data-hue] .tb-body{fill:color-mix(in srgb,var(--tb-ink) 54%,var(--anatomy-shade-2))}
.tb[data-hue] .tb-shine{fill:color-mix(in srgb,var(--tb-ink) 16%,var(--anatomy-top))}
.tb[data-hue] .tb-shade{fill:color-mix(in srgb,var(--tb-ink) 30%,var(--anatomy-hi))}
.tb[data-hue] .tb-edge{stroke:color-mix(in srgb,var(--tb-ink) 38%,var(--anatomy-hi))}
.tb[data-hue][data-mat] .tb-body{fill:color-mix(in srgb,var(--tb-ink) 62%,var(--mat-body))}
.tb[data-hue][data-mat] .tb-shine{fill:color-mix(in srgb,var(--tb-ink) 22%,var(--mat-shine))}
.tb[data-hue][data-mat] .tb-shade{fill:color-mix(in srgb,var(--tb-ink) 46%,var(--mat-shade))}
.tb[data-hue][data-mat] .tb-edge{stroke:color-mix(in srgb,var(--tb-ink) 30%,var(--mat-edge))}
.iso-turn{position:relative}
.iso-turn>.iso-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.toki-stage{touch-action:pan-y;cursor:grab;outline:none;border-radius:8px}
.toki-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.toki-stage[data-drag]{cursor:grabbing}
.toki-scene{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 240ms linear}
.toki-scene[data-active]{opacity:1}
.toki-scene[data-gone]{visibility:hidden}
.toki-scene>.iso-layer{position:absolute;inset:0;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.toki-scene{transition:none}}

/* inks for decals and screens: every colour is a token, light first */
.iso{--toki-black:#2c2d30;--toki-eye:#0c0c0e;--toki-gloss:#ffffff;--toki-screen:#0a0b0c;--toki-pixel:#f2f7f5;--toki-glass:#16181a;--toki-lens:#bcc8cf}
.iso[data-theme="dark"]{--toki-black:#0d0d0e;--toki-eye:#040405;--toki-gloss:#e8e8e8;--toki-screen:#050606;--toki-pixel:#f2f7f5;--toki-glass:#0a0b0c;--toki-lens:#3a4a52}
.tk-ink{fill:var(--toki-black)}
.tk-eye{fill:var(--toki-eye);stroke:var(--anatomy-mid);stroke-width:.6}
.tk-gloss{fill:var(--toki-gloss)}
.tk-pad{fill:var(--anatomy-mid)}

/* recesses on the belly and back (live.js) */
.tk-recess .tk-back{stroke-width:.4;stroke-linejoin:round}
.tk-recess .tk-screen{fill:var(--toki-screen);stroke:var(--toki-screen)}
.tk-recess .tk-rocker{fill:var(--anatomy-shade-1);stroke:var(--anatomy-shade-1)}
.tk-recess .tk-port{fill:var(--anatomy-shade-0);stroke:var(--anatomy-shade-0)}
.tk-recess .tk-rim{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.tk-recess[data-lit] .tk-rim{stroke:var(--anatomy-lit)}
.tk-recess .tk-floor{fill:none;stroke:var(--anatomy-faint);stroke-width:var(--anatomy-weight)}

/* the OLED picture: white on black in both themes */
.iso-svg .tk-px{fill:none;stroke:var(--toki-pixel);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;vector-effect:none}
.tk-pxf{fill:var(--toki-pixel);stroke:none}
.tk-face{transition:opacity 200ms linear}
[data-power="off"] .tk-face{opacity:0}
@media (prefers-reduced-motion:reduce){.tk-face{transition:none}}
.iso-svg .tk-mark{fill:none;stroke:var(--anatomy-hi);stroke-width:.7;stroke-linecap:round;vector-effect:none}

/* hardware: selection steps tones */
.toki-scene[data-sel] .iso-live g[data-dim]{--anatomy-hi:var(--toki-step-hi);--anatomy-mid:var(--toki-step-mid);--anatomy-lo:var(--toki-step-lo)}
.iso{--toki-step-hi:#8a8a8f;--toki-step-mid:#b4b4b8;--toki-step-lo:#d4d4d6}
.iso[data-theme="dark"]{--toki-step-hi:#6a6a6a;--toki-step-mid:#3e3e3e;--toki-step-lo:#2a2a2a}
.toki-scene .iso-live g[data-lit] .iso-edge,.toki-scene .iso-live g[data-lit] [data-r="edge"]{stroke:var(--anatomy-lit)}
.toki-scene .iso-live g[data-up] .tb-edge{stroke-width:1}
.toki-scene .iso-live [data-trace][data-up]{stroke:var(--anatomy-hi)}
.toki-scene .iso-live [data-trace][data-dim]{stroke:var(--anatomy-faint)}
.toki-scene[data-scene="core"][data-active] .iso-live .iso-fill,
.toki-scene[data-scene="core"][data-active] .iso-live .tb-body{pointer-events:visiblePainted}

/* the clear bezel lens */
.toki-scene .iso-live g[data-name="frame.lens"] .iso-fill,.toki-scene .iso-live g[data-name="frame.lens"] .iso-tn,.toki-scene .iso-live g[data-name="frame.lens"] .iso-top{fill-opacity:.18}

/* legend */
.toki-legend{display:flex;flex-direction:column;gap:10px;margin:14px 2px 0}
.toki-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.toki-parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 6px}
.toki-btn{appearance:none;border:1px solid var(--anatomy-faint);background:transparent;color:var(--anatomy-text);font:12px/1.4 var(--anatomy-mono);padding:3px 8px;border-radius:6px;cursor:pointer;text-align:left}
.toki-btn:hover{border-color:var(--anatomy-lo);color:var(--anatomy-strong)}
.toki-btn[aria-pressed="true"]{border-color:var(--anatomy-mid);color:var(--anatomy-strong)}
.toki-btn:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:2px}
.toki-num{color:var(--anatomy-muted);margin-right:6px}
.toki-dot{color:var(--anatomy-muted)}
.toki-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tk-hole{fill:var(--anatomy-lo)}
.tk-bus{fill:var(--anatomy-lo)}
.tk-glass{fill:var(--toki-glass)}
.tk-screen-bg{fill:var(--toki-screen)}
.tk-port-mouth{fill:var(--toki-screen)}
.iso{--toki-pad:#9c9ea2}
.iso[data-theme="dark"]{--toki-pad:#3c3e42}
.tk-pad{fill:var(--toki-pad)}
.tk-chip{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:.4}
.tk-chip-c{fill:var(--anatomy-shade-2)}
.tk-led{fill:var(--anatomy-mid)}
/* dark theme: the white plush keeps reading as white against the black rubber */
.iso[data-theme="dark"] .toki-scene[data-scene="skin"] g:is([data-name="head"],[data-name="muzzle"],[data-name="torso.lower"]){--anatomy-paper:#8d8d8a;--anatomy-face:#9a9a97;--anatomy-top:#a6a6a3;--anatomy-shade-0:#6c6c69;--anatomy-shade-1:#7a7a77;--anatomy-shade-2:#878784;--anatomy-shade-3:#949491;--anatomy-lit-top:#b0b0ad;--anatomy-lit-shade:#9a9a97;--anatomy-hi:#e8e8e6;--anatomy-mid:#b8b8b5;--anatomy-lo:#5c5c5a;--anatomy-faint:#7c7c79;--tn-0:var(--anatomy-shade-0);--tn-1:var(--anatomy-shade-1);--tn-2:var(--anatomy-shade-2);--tn-3:var(--anatomy-shade-3);--tn-4:var(--anatomy-top)}
.iso[data-theme="dark"] .toki-scene[data-scene="skin"] g[data-name="torso.lower"] .tk-recess{--anatomy-shade-0:#4e4e4c;--anatomy-shade-1:#5a5a58;--anatomy-shade-2:#666664;--anatomy-shade-3:#72726f}

/* zoom, disassembly, inspect */
.toki-stage{overflow:hidden}
.toki-stage[data-pan]{cursor:move}
.toki-gap{width:10px}
.toki-chip{font:12px/1.4 var(--anatomy-mono);color:var(--anatomy-muted);min-width:3.4em}
.toki-tip{font:11px/1.4 var(--anatomy-mono);color:var(--anatomy-muted)}
.toki-btn:disabled{opacity:.4;cursor:default}
.toki-scene .iso-live g[data-name]{transition:opacity 300ms linear}
.toki-scene[data-inspect] .iso-live g[data-name]:not([data-keep]){opacity:0;pointer-events:none}
.toki-stage>svg.iso-svg:first-child{transition:opacity 300ms linear}
.toki-stage[data-inspecting]>svg.iso-svg:first-child{opacity:.15}
@media (prefers-reduced-motion:reduce){.toki-scene .iso-live g[data-name],.toki-stage>svg.iso-svg:first-child{transition:none}}
/* long readouts (a selection with its signal) wrap instead of running into the hint */
.iso-plate-corner[data-corner="readout"]{white-space:normal;max-width:52%;text-align:right;line-height:1.35}
.iso-plate-corner[data-corner="hint"]{white-space:normal;max-width:46%;line-height:1.35}

/* simulation: transcript, chips, packets and arcs */
.toki-sim{border:1px solid var(--anatomy-faint);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.toki-sim[hidden]{display:none}
.toki-transcript{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font:13px/1.45 ui-sans-serif,system-ui,sans-serif}
.toki-line{display:flex;gap:8px;align-items:baseline}
.toki-who{font:11px/1.4 var(--anatomy-mono);color:var(--anatomy-muted);min-width:3.6em}
.toki-line[data-who="toki"] .toki-text{color:var(--anatomy-strong)}
.toki-line[data-who="child"] .toki-text{color:var(--anatomy-text);font-style:italic}
.toki-note .toki-text{color:var(--anatomy-muted);font-size:12px}
.toki-badge{margin-left:auto;font:10.5px/1.4 var(--anatomy-mono);color:var(--anatomy-muted);white-space:nowrap}
.toki-replies{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.toki-say{display:flex;gap:6px}
.toki-say input{flex:1;min-width:0;font:13px/1.4 ui-sans-serif,system-ui,sans-serif;padding:4px 8px;border-radius:6px;border:1px solid var(--anatomy-faint);background:transparent;color:var(--anatomy-strong)}
.toki-say input:disabled{opacity:.5}
.tk-packet{stroke:none;fill:color-mix(in srgb,var(--toki-packet-ink) 45%,#ffffff)}
.tk-packet[data-hue="blue"]{--toki-packet-ink:var(--anatomy-blue)}
.tk-packet[data-hue="green"]{--toki-packet-ink:var(--anatomy-green)}
.tk-packet[data-hue="red"]{--toki-packet-ink:var(--anatomy-red)}
.iso-svg .tk-arc{fill:none;stroke:var(--anatomy-lit);stroke-width:1.4;stroke-linecap:round}

/* ---------- full-window app: a viewport and a left sidebar, like a 3D editor ---------- */
.iso{--tk-side-bg:#efefec;--tk-side-line:#dcdcd8;--tk-view-bg:var(--anatomy-paper);--toki-apple:#d23a2f;--toki-apple-hi:#ff8a6e;--toki-apple-lo:#7c1a14;--toki-leaf:#3f9a46;--toki-stem:#6b4a2b;--toki-cone:#3e63dd}
.iso[data-theme="dark"]{--tk-side-bg:#0d0d0d;--tk-side-line:#222;--toki-apple:#d9483c;--toki-apple-hi:#ff9a80;--toki-apple-lo:#6e1712;--toki-leaf:#4fb35a;--toki-stem:#8a6640;--toki-cone:#6b9bff}
html:has(body.tk-body),body.tk-body{height:100%;margin:0}
body.tk-body{background:var(--tk-view-bg);overflow:hidden;color:var(--anatomy-text);font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.tk-app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh;width:100vw;transition:grid-template-columns 200ms ease}
.tk-app[data-side="closed"]{grid-template-columns:0 minmax(0,1fr)}
.tk-side{overflow-y:auto;overflow-x:hidden;background:var(--tk-side-bg);border-right:1px solid var(--tk-side-line);padding:10px 10px 24px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tk-app[data-side="closed"] .tk-side{visibility:hidden;padding:0;border:0}
.tk-brand{display:flex;flex-direction:column;gap:2px;padding:6px 6px 10px;border-bottom:1px solid var(--tk-side-line);margin-bottom:4px}
.tk-brand .tk-fig{font:11px/1.3 var(--anatomy-mono);color:var(--anatomy-muted)}
.tk-brand .tk-name{font:12px/1.3 var(--anatomy-mono);color:var(--anatomy-strong);text-transform:uppercase;letter-spacing:.06em}
.tk-panel{border:1px solid var(--tk-side-line);border-radius:6px;background:var(--tk-view-bg)}
.tk-panel>summary{cursor:pointer;list-style:none;padding:6px 10px;font:11px/1.4 var(--anatomy-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--anatomy-strong);display:flex;align-items:center;gap:6px}
.tk-panel>summary::-webkit-details-marker{display:none}
.tk-panel>summary::before{content:"▸";color:var(--anatomy-muted);transition:transform 150ms}
.tk-panel[open]>summary::before{transform:rotate(90deg)}
.tk-panel-body{padding:2px 10px 10px;display:flex;flex-direction:column;gap:6px}
.tk-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tk-primary{border-color:var(--anatomy-mid)!important;color:var(--anatomy-strong)!important}
.tk-keys{margin:0;font:10.5px/1.45 var(--anatomy-mono);color:var(--anatomy-muted)}
.tk-progress{height:3px;border-radius:2px;background:var(--tk-side-line);overflow:hidden}
.tk-progress>div{height:100%;width:0;background:var(--anatomy-hi)}
.tk-chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.tk-ch{appearance:none;background:none;border:0;width:100%;text-align:left;padding:3px 6px;border-radius:4px;font:12px/1.4 var(--anatomy-mono);color:var(--anatomy-text);cursor:pointer;display:flex;gap:8px}
.tk-ch:hover{background:var(--tk-side-line)}
.tk-ch[aria-current="true"]{color:var(--anatomy-strong);background:var(--tk-side-line)}
.tk-num{color:var(--anatomy-muted)}
.tk-parts{display:flex;flex-direction:column;gap:3px}
.tk-parts .toki-btn{width:100%;display:flex;gap:8px}
.tk-keylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font:12px/1.4 var(--anatomy-mono)}
.tk-swatch{display:inline-block;width:16px;height:2px;margin-right:8px;vertical-align:middle;background:var(--anatomy-red)}
.tk-swatch[data-hue="blue"]{background:var(--anatomy-blue)}
.tk-swatch[data-hue="green"]{background:var(--anatomy-green)}
.tk-about{margin:0;font-size:12.5px;line-height:1.55}
.tk-view{position:relative;overflow:hidden;background:var(--tk-view-bg);min-width:0}
.tk-view .toki-stage{position:absolute;inset:0;border-radius:0}
.tk-view .toki-stage>svg.iso-svg{position:absolute;inset:0;width:100%;height:100%}
.tk-view .toki-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:-6px}
.tk-ov{position:absolute;font:11px/1.35 var(--anatomy-mono);color:var(--anatomy-muted);letter-spacing:.04em;pointer-events:none}
.tk-ov-tl,.tk-ov-bl,.tk-ov-br{padding:3px 7px;margin:-3px -7px;border-radius:5px;background:color-mix(in srgb,var(--tk-view-bg) 78%,transparent);backdrop-filter:blur(2px)}
.tk-ov-tl{top:16px;left:18px;display:flex;gap:14px}
.tk-ov-tl .tk-fig{color:var(--anatomy-text)}
.tk-ov-tl .tk-name{text-transform:uppercase;letter-spacing:.1em}
.tk-ov-tr{top:12px;right:14px;display:flex;gap:4px;pointer-events:auto}
.tk-ov-tr .toki-btn{background:var(--tk-view-bg)}
.tk-sep{width:8px}
.tk-ov-bl{bottom:16px;left:18px;text-transform:uppercase;letter-spacing:.1em;max-width:40%}
.tk-ov-br{bottom:16px;right:18px;color:var(--anatomy-text);text-align:right;max-width:46%;font-variant-numeric:tabular-nums}
.tk-sub{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);max-width:min(720px,80%);text-align:center;display:none;gap:10px;align-items:baseline;justify-content:center;padding:8px 14px;border-radius:8px;background:color-mix(in srgb,var(--tk-view-bg) 82%,transparent);backdrop-filter:blur(2px);pointer-events:none}
.tk-sub[data-on]{display:flex}

.tk-sub-who:empty{display:none}
.tk-sub-text{font-size:17px;line-height:1.4;color:var(--anatomy-strong)}
.tk-sub[data-who="narrator"] .tk-sub-text{font-size:14.5px;color:var(--anatomy-text);font-style:italic}
.tk-sub[data-who="child"] .tk-sub-text{font-style:italic}
.tk-sub-in{animation:tk-sub-in 280ms ease}
@keyframes tk-sub-in{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.tk-side-toggle{position:absolute;left:10px;top:42px;appearance:none;border:1px solid var(--anatomy-faint);background:var(--tk-view-bg);color:var(--anatomy-text);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1}
@media (prefers-reduced-motion:reduce){.tk-app{transition:none}.tk-sub-in{animation:none}}
/* phones: the sidebar is a drawer over the bottom of the viewport */
@media (max-width:760px){
  .tk-app,.tk-app[data-side="closed"]{grid-template-columns:minmax(0,1fr)}
  .tk-side{position:fixed;left:0;right:0;bottom:0;max-height:62vh;z-index:5;border-right:0;border-top:1px solid var(--tk-side-line);box-shadow:0 -8px 24px #0002;transition:transform 220ms ease}
  .tk-app[data-side="closed"] .tk-side{transform:translateY(100%);visibility:hidden}
  .tk-ov-tr{display:none}
  .tk-ov-bl{display:none}
  .tk-ov-br{max-width:70%}
  .tk-sub{bottom:46px;max-width:92%}
  .tk-sub-text{font-size:15px}
  .tk-side-toggle{top:auto;bottom:12px;left:12px;z-index:6}
  .tk-app[data-side="open"] .tk-side-toggle{bottom:calc(62vh + 10px)}
  .tk-side{height:62vh;box-sizing:border-box}
}
/* demo boot: the OLED shows the battery first, then the face */
[data-boot="0"] .tk-face{opacity:0}
[data-boot="1"] .tk-face>:not(.tk-batt){opacity:0}
/* the apple */
.iso-svg .tk-apple path,.iso-svg .tk-apple ellipse{vector-effect:none}
.tk-apple-body{stroke:var(--toki-apple-lo);stroke-width:.03}
.tk-apple-shine{fill:#fff;opacity:.55}
.tk-apple-stem{fill:none;stroke:var(--toki-stem);stroke-width:.09;stroke-linecap:round}
.tk-apple-leaf{fill:var(--toki-leaf);stroke:color-mix(in srgb,var(--toki-leaf) 60%,#000);stroke-width:.025}
.tk-cone{stroke:none}
.tk-spark{fill:var(--anatomy-hi)}

ehind its nose send image and sound through an ESP32 to a backend over Wi-Fi; the answer comes back as speech from a 3 W speaker and as an emotion on a 0.96-inch display. One 18650 cell, raised to 5 V, powers everything. The hardware view is shown without plush, stuffing and the frame's side shells.</span></figcaption></figure><p class="toki-live" aria-live="polite"></p></main><script type="module">const T3_ROOT = Math.sqrt(1.6);
const T3_TAU = Math.PI * 2;
const T3_RAD = Math.PI / 180;
const T3_LB = [0, 0.2, 0.42, 0.62];
const T3_EB = [0.25, 0.5, 0.75];
const T3_SOFT = 0.035;
const T3_LEVELS = 32;
const T3_Q = 64;
const t3State = { detail: 1, exact: false };

function t3Num(v) {
  if (t3State.exact) return String(Math.round(v * 1e6) / 1e6);
  let t = Math.round(v * 100);
  if (t === 0) return "0";
  let sign = "";
  if (t < 0) {
    sign = "-";
    t = -t;
  }
  const whole = Math.floor(t / 100);
  const part = t - whole * 100;
  if (part === 0) return sign + whole;
  if (part < 10) return sign + whole + ".0" + part;
  return sign + whole + "." + (part % 10 === 0 ? part / 10 : part);
}

function t3Fix(v, scale) {
  const t = Math.round(v * scale) / scale;
  return t === 0 ? "0" : String(t);
}

function t3Path(buf, count, closed) {
  if (count < 2) return "";
  let s = "M" + t3Num(buf[0]) + " " + t3Num(buf[1]);
  for (let i = 1; i < count; i++) s += "L" + t3Num(buf[2 * i]) + " " + t3Num(buf[2 * i + 1]);
  return closed ? s + "Z" : s;
}

const t3Step = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

function t3Level(score, bands) {
  let u = 0;
  for (let i = 0; i < bands.length; i++) u += t3Step(bands[i] - T3_SOFT, bands[i] + T3_SOFT, score);
  return Math.round(u * T3_Q);
}

function t3Grow(f, name, size, Kind) {
  if (!f[name] || f[name].length < size) f[name] = new Kind(Math.max(size, f[name] ? f[name].length * 2 : 16));
  return f[name];
}

function t3Box(buf, count, box) {
  let x0 = Infinity;
  let y0 = Infinity;
  let x1 = -Infinity;
  let y1 = -Infinity;
  for (let i = 0; i < count; i++) {
    const x = buf[2 * i];
    const y = buf[2 * i + 1];
    if (x < x0) x0 = x;
    if (x > x1) x1 = x;
    if (y < y0) y0 = y;
    if (y > y1) y1 = y;
  }
  box[0] = x0;
  box[1] = y0;
  box[2] = x1;
  box[3] = y1;
}

function t3Unit(v) {
  const l = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / l, v[1] / l, v[2] / l];
}

function t3Rot(axis, degrees) {
  const [x, y, z] = t3Unit(axis);
  const c = Math.cos(degrees * T3_RAD);
  const s = Math.sin(degrees * T3_RAD);
  const C = 1 - c;
  return new Float64Array([c + x * x * C, x * y * C - z * s, x * z * C + y * s, y * x * C + z * s, c + y * y * C, y * z * C - x * s, z * x * C - y * s, z * y * C + x * s, c + z * z * C]);
}

function t3Mul(A, B) {
  const out = new Float64Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) out[r * 3 + c] = A[r * 3] * B[c] + A[r * 3 + 1] * B[3 + c] + A[r * 3 + 2] * B[6 + c];
  return out;
}

const t3Apply = (R, v) => [R[0] * v[0] + R[1] * v[1] + R[2] * v[2], R[3] * v[0] + R[4] * v[1] + R[5] * v[2], R[6] * v[0] + R[7] * v[1] + R[8] * v[2]];

const T3_EYE = new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);

function t3Camera(P, pose) {
  const a = (P.azimuth ?? 45) * T3_RAD;
  const e = (P.elevation ?? 30) * T3_RAD;
  const k = P.scale * T3_ROOT;
  const sa = Math.sin(a);
  const ca = Math.cos(a);
  const se = Math.sin(e);
  const ce = Math.cos(e);
  const cam = { m: new Float64Array(6), ox: 0, oy: 0, V: [0, 0, 0], L: [0, 0, 0], k, turn: 0, R: T3_EYE, t: [0, 0, 0], lx: 0, ly: 1, sa, ca, se, ce, origin: P.origin };
  const lw = Math.hypot(sa, ca, 1.2);
  if (pose && pose.R && !(pose.turn !== undefined && pose.root)) {
    const R = pose.R;
    const t = pose.t ?? [0, 0, 0];
    const r0 = [sa * k, -ca * k, 0];
    const r1 = [ca * se * k, sa * se * k, -ce * k];
    for (let c = 0; c < 3; c++) {
      cam.m[c] = r0[0] * R[c] + r0[1] * R[3 + c] + r0[2] * R[6 + c];
      cam.m[3 + c] = r1[0] * R[c] + r1[1] * R[3 + c] + r1[2] * R[6 + c];
    }
    cam.ox = P.origin[0] + r0[0] * t[0] + r0[1] * t[1] + r0[2] * t[2];
    cam.oy = P.origin[1] + r1[0] * t[0] + r1[1] * t[1] + r1[2] * t[2];
    const V = [ca * ce, sa * ce, se];
    const L = [-sa / lw, ca / lw, 1.2 / lw];
    for (let c = 0; c < 3; c++) {
      cam.V[c] = R[c] * V[0] + R[3 + c] * V[1] + R[6 + c] * V[2];
      cam.L[c] = R[c] * L[0] + R[3 + c] * L[1] + R[6 + c] * L[2];
    }
    cam.R = R;
    cam.t = t;
  } else {
    const turn = pose ? pose.turn ?? 0 : 0;
    const pivot = pose && pose.pivot ? pose.pivot : [0, 0];
    const b = a - turn * T3_RAD;
    const sb = Math.sin(b);
    const cb = Math.cos(b);
    cam.m[0] = sb * k;
    cam.m[1] = -cb * k;
    cam.m[2] = 0;
    cam.m[3] = cb * se * k;
    cam.m[4] = sb * se * k;
    cam.m[5] = -ce * k;
    cam.ox = P.origin[0] + (pivot[0] * sa - pivot[1] * ca) * k;
    cam.oy = P.origin[1] + (pivot[0] * ca + pivot[1] * sa) * se * k;
    cam.V = [cb * ce, sb * ce, se];
    cam.L = [-sb / lw, cb / lw, 1.2 / lw];
    cam.turn = turn;
    const c = Math.cos(turn * T3_RAD);
    const s = Math.sin(turn * T3_RAD);
    cam.R = new Float64Array([c, -s, 0, s, c, 0, 0, 0, 1]);
    cam.t = [pivot[0], pivot[1], 0];
  }
  const lh = Math.hypot(cam.L[0], cam.L[1]) || 1;
  cam.lx = cam.L[0] / lh;
  cam.ly = cam.L[1] / lh;
  return cam;
}

function t3Quat(q) {
  const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
  const x = q[0] / l;
  const y = q[1] / l;
  const z = q[2] / l;
  const w = q[3] / l;
  return new Float64Array([1 - 2 * (y * y + z * z), 2 * (x * y - z * w), 2 * (x * z + y * w), 2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w), 2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)]);
}

function t3FreeRot(v) {
  if (v.R) return v.R instanceof Float64Array ? v.R : Float64Array.from(v.R);
  if (v.q) return t3Quat(v.q);
  if (v.axis) return t3Rot(v.axis, v.angle ?? 0);
  return T3_EYE;
}

function t3Poses(groups, values) {
  const get = (name) => (values instanceof Map ? values.get(name) : values ? values[name] : undefined) ?? 0;
  const list = [];
  for (let index = 0; index < groups.length; index++) {
    const g = groups[index];
    const v = get(g.name);
    let parent = g.parent === undefined || g.parent === null || g.parent < 0 ? null : list[g.parent];
    let po = parent ? groups[g.parent].origin : [0, 0, 0];
    let R = T3_EYE;
    let t = [g.origin[0] - po[0], g.origin[1] - po[1], g.origin[2] - po[2]];
    if (g.kind === "turn") R = t3Rot([0, 0, 1], v);
    else if (g.kind === "hinge") R = t3Rot(g.axis, v);
    else if (g.kind === "slide") {
      const d = t3Unit(g.direction);
      t[0] += d[0] * v;
      t[1] += d[1] * v;
      t[2] += d[2] * v;
    } else if (g.kind === "free" && v && typeof v === "object") {
      R = t3FreeRot(v);
      if (v.world) {
        parent = null;
        po = [0, 0, 0];
        t = [g.origin[0], g.origin[1], g.origin[2]];
      }
      if (v.t) {
        t[0] += v.t[0];
        t[1] += v.t[1];
        t[2] += v.t[2];
      }
    }
    if (!parent) {
      const pose = { R, t, value: v };
      if (g.kind === "turn") Object.assign(pose, { turn: v, pivot: [g.origin[0], g.origin[1]], root: true });
      list.push(pose);
      continue;
    }
    const tw = t3Apply(parent.R, t);
    list.push({ R: t3Mul(parent.R, R), t: [tw[0] + parent.t[0], tw[1] + parent.t[1], tw[2] + parent.t[2]], value: v });
  }
  return list;
}

function t3PosesMap(groups, values) {
  const list = t3Poses(groups, values);
  return new Map(groups.map((g, index) => [g.name, list[index]]));
}

function t3Roles(part) {
  const roles = [];
  const spec = part.spec;
  const details = part.details ?? {};
  const add = (name, type, extra = {}) => roles.push({ name, type, ...extra });
  const tone = part.tone ?? "hi";
  const crease = part.crease ?? "faint";
  const fadedSlots = (prefix, count, cls, lineTone) => {
    for (let j = 0; j < count; j++) add(`${prefix}${j}`, "slot", { cls, tone: lineTone });
  };
  const planes = () => (part.planes ?? []).forEach((_, j) => add(`plane${j}`, "plane"));
  const dots = () => (part.dots ?? []).forEach((dot, j) => add(`c${j}`, "dot", { tone: dot.tone ?? "mid", size: dot.size ?? 0.5 }));
  const sheets = (top) => {
    for (let t = 0; t < 4; t++) add(`s${t}`, "path", { cls: "iso-shade", shade: t });
    if (top) add("s4", "path", { cls: "iso-top" });
  };
  const inner = () => {
    if ((details.seams && details.seams.length) || (details.ribs && details.ribs.seams)) add("inner", "path", { cls: "iso-line", tone: "faint" });
  };
  const ribs = () => {
    if (details.ribs) fadedSlots("r", spec.slots?.ribs ?? 6, "iso-line", details.ribs.tone ?? "lo");
  };
  if (part.kind === "prism") {
    add("fill", "path", { cls: "iso-fill" });
    const faces = spec.ring.length / 2 + (spec.up ? 0 : 2);
    for (let j = 0; j < faces; j++) add(`f${j}`, "face");
    if (spec.up) add("top", "xform", { cls: "iso-top" });
    if (crease !== "none") add("crease", "path", { cls: "iso-line iso-crease", tone: crease });
    if (spec.bevel && crease !== "none") fadedSlots("v", spec.slots?.bevel ?? 6, "iso-line iso-bevel", crease);
    if (details.seams && details.seams.length) add("inner", "path", { cls: "iso-line", tone: "faint" });
    planes();
    add("edge", "path", { cls: "iso-line iso-edge", tone });
    dots();
  } else if (part.kind === "round" || part.kind === "lathe") {
    add("fill", "path", { cls: "iso-fill" });
    sheets(true);
    const ends = part.kind === "round" ? spec.ends : spec.caps.map((cap) => (cap ? "flat" : "open"));
    ends.forEach((end, j) => end === "flat" && add(`k${j}`, "face"));
    if (crease !== "none") add("crease", "path", { cls: "iso-line iso-crease", tone: crease });
    inner();
    ribs();
    planes();
    add("edge", "path", { cls: "iso-line iso-edge", tone });
    dots();
  } else if (part.kind === "ball") {
    add("fill", "path", { cls: "iso-fill" });
    sheets(false);
    spec.flats.forEach((_, j) => add(`f${j}`, "face"));
    if (crease !== "none") add("crease", "path", { cls: "iso-line iso-crease", tone: crease });
    planes();
    add("edge", "path", { cls: "iso-line iso-edge", tone });
    dots();
  } else if (part.kind === "tube") {
    add("body", "path", { cls: "tb-body" });
    if (spec.wide) {
      add("shine", "path", { cls: "tb-shine" });
      add("shade", "path", { cls: "tb-shade" });
    }
    if (spec.rings) fadedSlots("r", spec.slots?.ribs ?? 6, "tb-ring", spec.rings.tone ?? "lo");
    add("edges", "path", { cls: "iso-line tb-edge", tone });
  } else if (part.kind === "fixed") {
    add("move", "self");
    ribs();
    planes();
    dots();
  }
  return roles;
}

function t3Planes(list) {
  return (list ?? []).map((plane) => ({ o: plane.o, u: plane.u, v: plane.v, n: plane.n, fade: plane.fade ?? [0.04, 0.3], billboard: Boolean(plane.billboard) }));
}

function t3Dots(list) {
  return (list ?? []).map((dot) => ({ p: dot.p, n: dot.n ?? null, size: dot.size ?? 0.5, fade: dot.fade ?? [0.04, 0.42] }));
}

function t3PreparePrism(run, part) {
  const spec = part.spec;
  const n = spec.ring.length / 2;
  run.n = n;
  run.up = Boolean(spec.up);
  const ring = Float64Array.from(spec.ring);
  run.ring = ring;
  const nx = new Float64Array(n);
  const ny = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = ring[2 * j] - ring[2 * i];
    const dy = ring[2 * j + 1] - ring[2 * i + 1];
    const l = Math.hypot(dx, dy) || 1;
    nx[i] = dy / l;
    ny[i] = -dx / l;
  }
  run.nx = nx;
  run.ny = ny;
  const F = spec.up ? { o: [0, 0, 0], a: [0, 0, 1], u: [1, 0, 0], v: [0, 1, 0] } : spec.F;
  run.F = F;
  run.s0 = spec.up ? spec.z0 : spec.s0;
  run.s1 = spec.up ? spec.z1 : spec.s1;
  const lo = new Float64Array(3 * n);
  const hi = new Float64Array(3 * n);
  const N3 = new Float64Array(3 * n);
  for (let i = 0; i < n; i++) {
    const x = ring[2 * i];
    const y = ring[2 * i + 1];
    for (let c = 0; c < 3; c++) {
      const base = F.o[c] + F.u[c] * x + F.v[c] * y;
      lo[3 * i + c] = base + F.a[c] * run.s0;
      hi[3 * i + c] = base + F.a[c] * run.s1;
      N3[3 * i + c] = F.u[c] * nx[i] + F.v[c] * ny[i];
    }
  }
  run.lo = lo;
  run.hi = hi;
  run.N3 = N3;
  run.sharp = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const p = (i - 1 + n) % n;
    run.sharp[i] = nx[p] * nx[i] + ny[p] * ny[i] < Math.cos(0.35) ? 1 : 0;
  }
  if (spec.bevel) {
    const inset = new Float64Array(2 * n);
    for (let i = 0; i < n; i++) {
      const p = (i - 1 + n) % n;
      const mx = nx[p] + nx[i];
      const my = ny[p] + ny[i];
      const l = Math.hypot(mx, my) || 1;
      inset[2 * i] = ring[2 * i] - (mx / l) * spec.bevel;
      inset[2 * i + 1] = ring[2 * i + 1] - (my / l) * spec.bevel;
    }
    run.inset = inset;
  }
  run.seams = part.details && part.details.seams ? part.details.seams.slice() : null;
  run.cut = spec.cuts && spec.cuts.length ? spec.cuts : null;
}

function t3Axes(run, part) {
  if (run.kind === "ball") return run.flats.map((flat) => flat.n);
  if (run.kind === "tube") return run.tips.slice();
  if (run.kind === "prism") {
    const out = [run.F.a];
    for (let i = 0; i < run.n; i++) {
      const n = [run.N3[3 * i], run.N3[3 * i + 1], run.N3[3 * i + 2]];
      if (out.every((m) => Math.abs(m[0] * n[0] + m[1] * n[1] + m[2] * n[2]) < 0.9995)) out.push(n);
    }
    return out;
  }
  if (run.F) return [run.F.a];
  if (part.spec && part.spec.F) return [part.spec.F.a];
  return [];
}

function t3Cloud(run, part) {
  const out = [];
  const ring = (F, s, r, count) => {
    for (let j = 0; j < count; j++) {
      const c = Math.cos((j / count) * T3_TAU);
      const n = Math.sin((j / count) * T3_TAU);
      out.push(F.o[0] + F.a[0] * s + r * (c * F.u[0] + n * F.v[0]), F.o[1] + F.a[1] * s + r * (c * F.u[1] + n * F.v[1]), F.o[2] + F.a[2] * s + r * (c * F.u[2] + n * F.v[2]));
    }
  };
  if (run.kind === "prism") {
    for (let i = 0; i < 3 * run.n; i++) out.push(run.lo[i]);
    for (let i = 0; i < 3 * run.n; i++) out.push(run.hi[i]);
  } else if (run.kind === "round") {
    ring(run.F, run.s0, run.r0, 24);
    ring(run.F, run.s1, run.r1, 24);
    for (const [end, s, r] of [[0, run.s0, run.r0], [1, run.s1, run.r1]]) {
      if (run.ends[end] !== "dome") continue;
      const sign = end ? 1 : -1;
      for (const b of [0.5, 1.0, 1.35]) ring(run.F, s + sign * r * Math.sin(b), r * Math.cos(b), 6);
      out.push(run.F.o[0] + run.F.a[0] * (s + sign * r), run.F.o[1] + run.F.a[1] * (s + sign * r), run.F.o[2] + run.F.a[2] * (s + sign * r));
    }
  } else if (run.kind === "ball") {
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < 64; i++) {
      const y = 1 - (2 * (i + 0.5)) / 64;
      const rad = Math.sqrt(1 - y * y);
      const w = [Math.cos(golden * i) * rad, Math.sin(golden * i) * rad, y];
      const p = [run.c[0] + run.r * w[0], run.c[1] + run.r * w[1], run.c[2] + run.r * w[2]];
      let inside = true;
      for (const flat of run.flats) if ((p[0] - run.c[0]) * flat.n[0] + (p[1] - run.c[1]) * flat.n[1] + (p[2] - run.c[2]) * flat.n[2] > flat.d + 1e-9) inside = false;
      if (inside) out.push(p[0], p[1], p[2]);
    }
    for (const flat of run.flats)
      for (let j = 0; j < 12; j++) {
        const c = Math.cos((j / 12) * T3_TAU) * flat.rho;
        const n = Math.sin((j / 12) * T3_TAU) * flat.rho;
        out.push(run.c[0] + flat.n[0] * flat.d + c * flat.u[0] + n * flat.v[0], run.c[1] + flat.n[1] * flat.d + c * flat.u[1] + n * flat.v[1], run.c[2] + flat.n[2] * flat.d + c * flat.u[2] + n * flat.v[2]);
      }
  } else if (run.kind === "lathe") {
    const lv = run.levels;
    const step = Math.max(4, Math.floor(lv.length / 4 / 8)) * 4;
    for (let i = 0; i < lv.length; i += step) ring(run.F, lv[i], lv[i + 1], 8);
    ring(run.F, lv[lv.length - 4], lv[lv.length - 3], 8);
  } else if (run.kind === "tube") {
    const b = run.body;
    const stride = Math.max(1, Math.floor(b.count / 8));
    for (let i = 0; i < b.count; i += stride) {
      const T = t3Unit([b.D3[3 * i], b.D3[3 * i + 1], b.D3[3 * i + 2]]);
      const [u, v] = t3Basis(T);
      ring({ o: [b.P3[3 * i], b.P3[3 * i + 1], b.P3[3 * i + 2]], a: T, u, v }, 0, run.r, 8);
    }
  } else if (part.cloud) for (const v of part.cloud) out.push(v);
  return Float64Array.from(out);
}

function t3Unpack(value, grouped) {
  if (!value) return new Float64Array(0);
  if (typeof value !== "string") return Float64Array.from(value);
  const text = atob(value);
  const bytes = new Uint8Array(text.length);
  for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i);
  const view = new DataView(bytes.buffer);
  const size = grouped ? 10 : 8;
  const stride = grouped ? 6 : 5;
  const count = bytes.length / size;
  const out = new Float64Array(count * stride);
  for (let e = 0; e < count; e++) {
    let o = e * size;
    const at = e * stride;
    out[at] = view.getUint16(o);
    out[at + 1] = view.getUint16(o + 2);
    o += 4;
    if (grouped) {
      out[at + 2] = view.getUint16(o) - 1;
      o += 2;
    }
    let x = (view.getUint16(o) / 65535) * 2 - 1;
    let y = (view.getUint16(o + 2) / 65535) * 2 - 1;
    const z = 1 - Math.abs(x) - Math.abs(y);
    if (z < 0) {
      const ox = (1 - Math.abs(y)) * (x >= 0 ? 1 : -1);
      const oy = (1 - Math.abs(x)) * (y >= 0 ? 1 : -1);
      x = ox;
      y = oy;
    }
    const l = Math.hypot(x, y, z) || 1;
    out[at + stride - 3] = x / l;
    out[at + stride - 2] = y / l;
    out[at + stride - 1] = z / l;
  }
  return out;
}

function t3Prepare(data, { unit = 1 } = {}) {
  const P = data.P;
  const runs = data.parts.map((part, index) => {
    const run = { index, name: part.name, kind: part.kind, group: part.group ?? -1, layer: part.layer, part, roles: t3Roles(part), planes: t3Planes(part.planes), dots: t3Dots(part.dots), unit };
    run.role = Object.fromEntries(run.roles.map((role, j) => [role.name, j]));
    if (part.kind === "prism") t3PreparePrism(run, part);
    else if (part.kind === "round") t3PrepareRound(run, part, P, unit);
    else if (part.kind === "ball") t3PrepareBall(run, part, P, unit);
    else if (part.kind === "lathe") t3PrepareLathe(run, part, P, unit);
    else if (part.kind === "tube") t3PrepareTube(run, part, data);
    else if (part.kind === "fixed") {
      run.anchor = part.spec.anchor;
      run.home = part.spec.home;
      run.box0 = part.spec.box;
      run.hull0 = Float64Array.from(part.spec.hull);
      run.F = part.spec.F ?? null;
      run.ribs = part.details && part.details.ribs ? part.details.ribs : null;
    }
    run.slots = part.spec.slots ?? {};
    run.cloud = t3Cloud(run, part);
    run.axes = t3Axes(run, part);
    const cn = run.cloud.length / 3;
    run.centroid = [0, 0, 0];
    for (let i = 0; i < cn; i++) for (let c = 0; c < 3; c++) run.centroid[c] += run.cloud[3 * i + c] / Math.max(1, cn);
    return run;
  });
  const layers = data.layers.map((layer, index) => {
    const parts = Int32Array.from(layer.parts);
    const local = new Map();
    parts.forEach((global, at) => local.set(global, at));
    const planar = t3Unpack(data.planes && data.planes[layer.name], false);
    const dynamic = Int32Array.from((data.dynamic && data.dynamic[layer.name]) ?? []);
    const free = Int32Array.from((data.free && data.free[layer.name]) ?? []);
    const framed = t3Unpack(data.framed && data.framed[layer.name], true);
    const groupPairs = [];
    const raw = (data.groupPairs && data.groupPairs[layer.name]) ?? [];
    const members = new Map();
    for (const global of parts) {
      const g = runs[global].group;
      if (!members.has(g)) members.set(g, []);
      members.get(g).push(global);
    }
    for (let p = 0; p < raw.length; p += 6) groupPairs.push({ a: Int32Array.from(members.get(raw[p]) ?? []), b: Int32Array.from(members.get(raw[p + 1]) ?? []), frame: raw[p + 2], n: [raw[p + 3], raw[p + 4], raw[p + 5]], boxA: new Float64Array(4), boxB: new Float64Array(4) });
    const looseAt = new Uint8Array(parts.length);
    for (const global of free) looseAt[local.get(global)] = 1;
    return { index, name: layer.name, parts, local, rest: Int32Array.from(layer.rest ?? layer.parts), planar, framed, groupPairs, dynamic, free, looseAt, warm: new Map() };
  });
  return { P, data, unit, groups: data.groups, runs, layers };
}

function t3Frame(run) {
  const count = run.roles.length;
  return { d: new Array(count).fill(""), q: new Int32Array(count), w: new Float64Array(count).fill(-1), t: new Array(count).fill(""), o: new Float64Array(count).fill(1), box: new Float64Array(4), hull: new Float64Array(64), hullN: 0, cx: new Float64Array(count), cy: new Float64Array(count), quads: null, quadN: 0 };
}

const t3Buf = { a: new Float64Array(1024), b: new Float64Array(1024), c: new Float64Array(1024) };

function t3Scratch(name, size) {
  if (t3Buf[name].length < size) t3Buf[name] = new Float64Array(size * 2);
  return t3Buf[name];
}

function t3SetHull(f, buf, count) {
  const hull = t3Grow(f, "hull", 2 * count, Float64Array);
  for (let i = 0; i < 2 * count; i++) hull[i] = buf[i];
  f.hullN = count;
}

function t3Faded(f, run, prefix, lines, count) {
  if (!f.fade) f.fade = {};
  const detail = t3State.detail;
  if (detail < 1) for (let i = 0; i < count; i++) lines.alpha[i] *= detail;
  if (detail < 0.01) count = 0;
  f.fade[prefix] = { key: lines.key.slice(0, count), alpha: lines.alpha.slice(0, count) };
  const slots = run.slots[prefix === "v" ? "bevel" : "ribs"] ?? 6;
  const levels = run._levels ?? (run._levels = new Array(T3_LEVELS + 1));
  for (let l = 0; l <= T3_LEVELS; l++) levels[l] = "";
  for (let i = 0; i < count; i++) {
    const alpha = lines.alpha[i];
    const level = Math.min(T3_LEVELS, Math.round(alpha * T3_LEVELS));
    if (level <= 0) continue;
    levels[level] += lines.d[i];
  }
  const present = [];
  for (let l = T3_LEVELS; l >= 1; l--) if (levels[l]) present.push([l, levels[l]]);
  while (present.length > slots) {
    let best = 1;
    let gap = Infinity;
    for (let i = 1; i < present.length; i++) {
      const g = present[i - 1][0] - present[i][0];
      if (g < gap) {
        gap = g;
        best = i;
      }
    }
    const [a, da] = present[best - 1];
    const [b, db] = present[best];
    present.splice(best - 1, 2, [(a + b) / 2, da + db]);
  }
  for (let j = 0; j < slots; j++) {
    const role = run.role[`${prefix}${j}`];
    if (role === undefined) continue;
    if (j < present.length) {
      f.d[role] = present[j][1];
      f.o[role] = present[j][0] / T3_LEVELS;
    } else {
      f.d[role] = "";
      f.o[role] = 0;
    }
  }
  return present.length;
}

const t3Lines = { d: [], alpha: [], key: [] };
const t3None = { d: [], alpha: [], key: [] };

function t3EmitPrism(run, cam, f) {
  const n = run.n;
  const m = cam.m;
  const ox = cam.ox;
  const oy = cam.oy;
  const V = cam.V;
  const L = cam.L;
  const lo = run.lo;
  const hi = run.hi;
  const N3 = run.N3;
  const bot = t3Scratch("a", 2 * n);
  const top = t3Scratch("b", 2 * n);
  for (let i = 0; i < n; i++) {
    const a = 3 * i;
    bot[2 * i] = ox + m[0] * lo[a] + m[1] * lo[a + 1] + m[2] * lo[a + 2];
    bot[2 * i + 1] = oy + m[3] * lo[a] + m[4] * lo[a + 1] + m[5] * lo[a + 2];
    top[2 * i] = ox + m[0] * hi[a] + m[1] * hi[a + 1] + m[2] * hi[a + 2];
    top[2 * i + 1] = oy + m[3] * hi[a] + m[4] * hi[a + 1] + m[5] * hi[a + 2];
  }
  const F = run.F;
  const aV = F.a[0] * V[0] + F.a[1] * V[1] + F.a[2] * V[2];
  const near = aV >= 0 ? top : bot;
  const far = aV >= 0 ? bot : top;
  const facing = run._facing ?? (run._facing = new Float64Array(n));
  for (let i = 0; i < n; i++) facing[i] = N3[3 * i] * V[0] + N3[3 * i + 1] * V[1] + N3[3 * i + 2] * V[2];
  const on = (i) => facing[((i % n) + n) % n] > 1e-9;

  for (let i = 0; i < n; i++)

      i0 = i;
      break;
    }

      sil[2 * count + 1] = near[2 * i + 1];
      silAt[count] = i;
      count++;
    }

    while (on(i1)) i1++;
    for (let j = i0; j <= i1; j++) {
      const i = j % n;
      sil[2 * count] = far[2 * i];
      sil[2 * count + 1] = far[2 * i + 1];
      silAt[count] = -1 - i;
      count++;
    }
    for (let j = i1; j <= i0 + n; j++) {
      const i = j % n;
      sil[2 * count] = near[2 * i];
      sil[2 * count + 1] = near[2 * i + 1];
      silAt[count] = i;
      count++;
    }
    if (count > 2 && Math.abs(sil[0] - sil[2 * count - 2]) < 1e-9 && Math.abs(sil[1] - sil[2 * count - 1]) < 1e-9) count--;
  }
  const outline = t3Path(sil, count, true);
  f.d[run.role.fill] = outline;
  if (run.cut) {
    const inPlane = (index) => {
      const at = silAt[index];

      return run.cut.some((cut) => Math.abs(cut.n[0] * set[3 * v] + cut.n[1] * set[3 * v + 1] + cut.n[2] * set[3 * v + 2] - cut.d) < 1e-3);
    };
    const flags = new Uint8Array(count);
    const onSame = (i, j) => {
      const at = (index) => {
        const a = silAt[index];
        const set = a < 0 ? farSet : nearSet;
